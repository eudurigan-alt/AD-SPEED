name: Build AD SPEED APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - - name: Extrair projeto
          run: |
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)
    if [ -z "$ZIP" ]; then
      echo "Arquivo ZIP não encontrado"
      find . -maxdepth 3 -type f
      exit 1
    fi
    unzip -o "$ZIP" -d project
      - name: Compilar APK
        run: gradle -p project assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AD-SPEED-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
