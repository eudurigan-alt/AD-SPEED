name: Build AD SPEED APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)
          unzip -o "$ZIP" -d project

      - name: Compilar APK
        run: gradle -p project assembleDebug -Pandroid.lifecycle.compileToTarget=17 -Porg.gradle.java.installations.auto-download=false

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
        name: AD-SPEED-APK
        path: project/app/build/outputs/apk/debug/app-debug.apk
