name: Build AD SPEED APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP nao encontrado"
            exit 1
          fi
          mkdir project
          unzip -o "$ZIP" -d project

      - name: Compilar APK
        run: gradle -p project assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AD-SPEED-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
